name: CI

on:
  push:
    branches: [main]
  pull_request:

# packages: read lets GITHUB_TOKEN install @xdev-asia/ui from GitHub Packages.
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file             libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # pnpm reads registry credentials only from user-level config.
      - name: Install dependencies
        run: |
          echo '//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc
      - run: pnpm -r typecheck
      - run: pnpm -r test

      # The desktop crate embeds the built frontend at compile time.
      - run: pnpm --filter desktop build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

      # The generated files are the same on every OS, so one is enough.
      # Intent-to-add makes a newly generated file show in the diff too.
      - name: Check packages/bindings matches the Rust types
        if: matrix.os == 'windows-latest'
        run: |
          cargo test -p xdev-desktop export_bindings
          git add --intent-to-add packages/bindings
          git diff --exit-code packages/bindings
