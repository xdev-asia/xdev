name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

      # The desktop crate embeds the built frontend at compile time.
      - run: pnpm --filter desktop build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The generated files are the same on every OS, so one is enough.
      # Intent-to-add makes a newly generated file show in the diff too.
      - name: Check packages/bindings matches the Rust types
        if: matrix.os == 'windows-latest'
        run: |
          cargo test -p xdev-desktop export_bindings
          git add --intent-to-add packages/bindings
          git diff --exit-code packages/bindings
