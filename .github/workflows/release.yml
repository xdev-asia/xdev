name: Release

# Every push to main updates a release PR (release-please, from Conventional
# Commits). Merging that PR tags the version, builds and signs every platform,
# then publishes the release, which is when installs see the update.
# A manual run builds every platform without signing, to test the matrix.
# A manual run with `rc_version` set builds and signs a release candidate in
# the `release` environment and writes rc-latest/latest.json (ADR 0005); it
# publishes only with `rc_publish` too, and never on a push.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rc_version:
        description: "Release candidate version, such as 0.6.0-rc.1. Empty: unsigned matrix test."
        type: string
        default: ""
      rc_publish:
        description: "Upload the candidate to the rc-latest release. Off: only attach latest.json to the run."
        type: boolean
        default: false

permissions:
  contents: read

# A queued run in the same group replaces the pending one, so a manual test
# build must not share a group with pushes or it drops a release.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4

  # release-please bumps Cargo.toml but not Cargo.lock, and the release
  # builds use --locked.
  lockfile:
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - run: rustup toolchain install
      - run: cargo update --workspace
      - name: Commit Cargo.lock
        run: |
          git diff --quiet Cargo.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Cargo.lock" Cargo.lock
          git push

  build:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    # The updater key lives only in this environment, which needs a reviewer
    # before a job can read it (ADR 0005). Manual runs stay outside it, except
    # a release candidate run, which signs.
    environment: ${{ (github.event_name == 'push' || inputs.rc_version != '') && 'release' || '' }}
    defaults:
      run:
        shell: bash
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The ARM images do not all ship rustup.
      - name: Install rustup if missing
        run: |
          command -v rustup >/dev/null && exit 0
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sSfLo rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            cygpath -w "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          else
            curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Tauri's beforeBuildCommand calls bare `pnpm`; the corepack shim makes
      # it resolve to the version pinned in package.json#packageManager.
      - run: corepack enable

      - name: Check submodule
        shell: bash
        run: |
          test -f packages/xdev-ui/package.json || { echo "run: git submodule update --init --recursive"; exit 1; }

      - run: corepack pnpm install --frozen-lockfile

      - run: cargo build --release -p xdev-cli --locked --target ${{ matrix.target }}

      - name: Check the release candidate version
        if: github.event_name == 'workflow_dispatch' && inputs.rc_version != ''
        run: |
          [[ "$RC_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || { echo "::error::rc_version must look like 0.6.0-rc.1"; exit 1; }
        env:
          RC_VERSION: ${{ inputs.rc_version }}

      # Updates are signed with the updater key; the installers themselves are
      # not OS code-signed yet (Windows unsigned, macOS ad-hoc "-"), so
      # SmartScreen and Gatekeeper still warn on first install.
      - name: Build desktop installers
        working-directory: apps/desktop
        run: |
          # The terminal service ships next to the app (tauri.ptyd.conf.json);
          # beforeBuildCommand builds it.
          bundles="$BUNDLES"
          # MSI accepts only a numeric pre-release, so a candidate ships no MSI;
          # the updater uses the NSIS installer.
          if [ -n "$RC_VERSION" ]; then
            bundles="${bundles//,msi/}"
            bundles="${bundles//msi,/}"
          fi
          args=(--target "$TARGET" --bundles "$bundles" --config src-tauri/tauri.ptyd.conf.json)
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          # A candidate must report its own version, or it would offer itself again.
          if [ -n "$RC_VERSION" ]; then
            args+=(--config "{\"version\":\"$RC_VERSION\"}")
          fi
          corepack pnpm tauri build "${args[@]}"
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
          RC_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.rc_version || '' }}
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage artifacts
        run: |
          # Unsigned manual builds have no updater files; publish checks a
          # release has them all.
          shopt -s nullglob
          mkdir -p out
          rel=target/${{ matrix.target }}/release
          bundle=$rel/bundle
          case "$RUNNER_OS" in
            Windows)
              cp "$rel/xdev.exe" "out/xdev-${{ matrix.target }}.exe"
              cp "$bundle"/nsis/*-setup.exe* out/
              if [ -d "$bundle/msi" ]; then cp "$bundle"/msi/*.msi* out/; fi
              ;;
            macOS)
              # tar keeps the executable bit that zip-based artifacts drop.
              tar -czf "out/xdev-${{ matrix.target }}.tar.gz" -C "$rel" xdev
              # The updater tarball is named xDev.app.tar.gz; adding the target
              # keeps the bytes the .sig covers.
              for f in "$bundle"/macos/xDev.app.tar.gz*; do
                name=$(basename "$f")
                cp "$f" "out/${name/xDev/xDev-${{ matrix.target }}}"
              done
              cp "$bundle"/dmg/*.dmg out/
              ;;
            Linux)
              tar -czf "out/xdev-${{ matrix.target }}.tar.gz" -C "$rel" xdev
              cp "$bundle"/appimage/*.AppImage* "$bundle"/deb/*.deb out/
              ;;
          esac
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: xdev-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The app reads releases/latest/download/latest.json, so it must list
      # every platform before the release becomes latest.
      - name: Write latest.json
        run: |
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          platforms='{}'
          add() {
            f=$(compgen -G "dist/$2" | head -n1)
            if [ -z "$f" ] || [ ! -f "$f.sig" ]; then
              echo "::error::no signed updater bundle for $1 ($2)"
              exit 1
            fi
            platforms=$(jq --arg k "$1" --arg url "$base/$(basename "$f")" \
              --arg sig "$(tr -d '\n' < "$f.sig")" \
              '.[$k] = {url: $url, signature: $sig}' <<< "$platforms")
          }
          add windows-x86_64 '*_x64-setup.exe'
          add windows-aarch64 '*_arm64-setup.exe'
          add darwin-aarch64 'xDev-aarch64-apple-darwin.app.tar.gz'
          add linux-x86_64 '*_amd64.AppImage'
          add linux-aarch64 '*_aarch64.AppImage'
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "https://github.com/$GH_REPO/releases/tag/$TAG" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: $platforms}' \
            > dist/latest.json
          cat dist/latest.json

      - run: gh release upload "$TAG" dist/* --clobber
      - run: gh release edit "$TAG" --draft=false --latest

  # A release candidate: the same signed bundles, listed in rc-latest/latest.json,
  # which only installs on the RC channel read. Manual runs only. Without
  # `rc_publish` it is a dry run: latest.json is attached to the run, nothing is
  # uploaded. The release is a prerelease and never "latest", so the stable
  # endpoint (releases/latest/download) does not move.
  rc-latest:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.rc_version != ''
    runs-on: ubuntu-latest
    # The bundles were signed in this environment; publishing them waits for the same reviewer.
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RC_VERSION: ${{ inputs.rc_version }}
      RC_TAG: rc-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write latest.json
        run: |
          base="https://github.com/$GH_REPO/releases/download/$RC_TAG"
          platforms='{}'
          add() {
            f=$(compgen -G "dist/$2" | head -n1)
            if [ -z "$f" ] || [ ! -f "$f.sig" ]; then
              echo "::error::no signed updater bundle for $1 ($2)"
              exit 1
            fi
            platforms=$(jq --arg k "$1" --arg url "$base/$(basename "$f")" \
              --arg sig "$(tr -d '\n' < "$f.sig")" \
              '.[$k] = {url: $url, signature: $sig}' <<< "$platforms")
          }
          add windows-x86_64 '*_x64-setup.exe'
          add windows-aarch64 '*_arm64-setup.exe'
          add darwin-aarch64 'xDev-aarch64-apple-darwin.app.tar.gz'
          add linux-x86_64 '*_amd64.AppImage'
          add linux-aarch64 '*_aarch64.AppImage'
          jq -n \
            --arg version "$RC_VERSION" \
            --arg notes "https://github.com/$GH_REPO/releases/tag/$RC_TAG" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: $platforms}' \
            > dist/latest.json
          cat dist/latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: rc-latest-json
          path: dist/latest.json
          if-no-files-found: error

      - name: Publish rc-latest
        if: inputs.rc_publish
        run: |
          if gh release view "$RC_TAG" >/dev/null 2>&1; then
            # Old candidates carry other file names; the release holds only this one.
            gh release view "$RC_TAG" --json assets --jq '.assets[].name' | while read -r name; do
              gh release delete-asset "$RC_TAG" "$name" --yes
            done
          else
            gh release create "$RC_TAG" --target "$GITHUB_SHA" --prerelease --latest=false               --title "Release candidate" --notes "The newest release candidate. Read by installs on the release candidate channel only."
          fi
          gh release upload "$RC_TAG" dist/* --clobber
