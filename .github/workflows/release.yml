name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    # The updater key lives only in this environment, which needs a reviewer
    # before a job can read it (ADR 0005).
    environment: release
    defaults:
      run:
        shell: bash
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Tauri's beforeBuildCommand calls bare `pnpm`; the corepack shim makes
      # it resolve to the version pinned in package.json#packageManager.
      - run: corepack enable

      - run: corepack pnpm install --frozen-lockfile

      - run: cargo build --release -p xdev-cli --locked

      # Updates are signed with the updater key; the installers themselves are
      # not OS code-signed yet (Windows unsigned, macOS ad-hoc "-"), so
      # SmartScreen and Gatekeeper still warn on first install.
      - name: Build desktop installers
        working-directory: apps/desktop
        run: corepack pnpm tauri build
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage artifacts
        run: |
          mkdir -p out
          bundle=target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/xdev.exe "out/xdev-${{ matrix.target }}.exe"
            cp "$bundle"/nsis/*.exe "$bundle"/nsis/*.exe.sig "$bundle"/msi/*.msi out/
          else
            # tar keeps the executable bit that zip-based artifacts drop.
            tar -czf "out/xdev-${{ matrix.target }}.tar.gz" -C target/release xdev
            # Tauri's own tarball, since the .sig covers exactly these bytes.
            cp "$bundle/macos/xDev.app.tar.gz" "out/xDev-${{ matrix.target }}.app.tar.gz"
            cp "$bundle/macos/xDev.app.tar.gz.sig" "out/xDev-${{ matrix.target }}.app.tar.gz.sig"
            cp "$bundle"/dmg/*.dmg out/
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: xdev-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The app reads releases/latest/download/latest.json, which resolves only
      # once the owner publishes the draft.
      - name: Write latest.json
        run: |
          win=$(ls dist/*-setup.exe)
          mac=dist/xDev-aarch64-apple-darwin.app.tar.gz
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_url "$base/$(basename "$win")" \
            --arg win_sig "$(tr -d '\n' < "$win.sig")" \
            --arg mac_url "$base/$(basename "$mac")" \
            --arg mac_sig "$(tr -d '\n' < "$mac.sig")" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "windows-x86_64": {url: $win_url, signature: $win_sig},
              "darwin-aarch64": {url: $mac_url, signature: $mac_sig}}}' \
            > dist/latest.json

      - name: Create draft release
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
