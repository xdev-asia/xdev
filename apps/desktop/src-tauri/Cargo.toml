[package]
name = "xdev-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "xdev_desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
blake3.workspace = true
dunce = "1.0.5"
regex.workspace = true
notify-debouncer-full.workspace = true
png = "0.18"
# The updater's own HTTP client, for the releases list of the build picker.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
semver = "1"
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3", features = ["parsing", "formatting"] }
tauri = { version = "2", features = ["devtools", "image-png"] }
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.6.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
tauri-plugin-updater = "2.14.1"
uuid = { version = "1.29", features = ["v4"] }
url.workspace = true
trash.workspace = true
xdev-agent.workspace = true
xdev-ai.workspace = true
xdev-awake.workspace = true
xdev-automations.workspace = true
xdev-core.workspace = true
xdev-git.workspace = true
xdev-id.workspace = true
xdev-input-source.workspace = true
xdev-ipc.workspace = true
xdev-kit.workspace = true
xdev-orch.workspace = true
xdev-policy.workspace = true
xdev-ports.workspace = true
xdev-pty.workspace = true
xdev-store.workspace = true
xdev-workspace.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Only to read the notification permission (Settings → Notifications).
block2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-user-notifications = "0.3.2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[dev-dependencies]
rusqlite.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
ts-rs.workspace = true
# Only the test that writes `packages/bindings` needs the TypeScript derives.
xdev-agent = { workspace = true, features = ["ts"] }
xdev-ai = { workspace = true, features = ["ts"] }
xdev-automations = { workspace = true, features = ["ts"] }
xdev-core = { workspace = true, features = ["ts"] }
xdev-git = { workspace = true, features = ["ts"] }
xdev-id = { workspace = true, features = ["ts", "test-util"] }
xdev-kit = { workspace = true, features = ["ts"] }
xdev-orch = { workspace = true, features = ["ts"] }
xdev-ports = { workspace = true, features = ["ts"] }
xdev-pty = { workspace = true, features = ["ts"] }
xdev-workspace = { workspace = true, features = ["ts"] }

[lints.rust]
# The process table on Windows needs the ToolHelp calls; they are allowed one by one.
unsafe_code = "deny"
