[package]
name = "xdev-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "xdev_desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2.14.1"
xdev-agent.workspace = true
xdev-ai.workspace = true
xdev-core.workspace = true
xdev-policy.workspace = true

[dev-dependencies]
tempfile.workspace = true
ts-rs.workspace = true
# Only the test that writes `packages/bindings` needs the TypeScript derives.
xdev-agent = { workspace = true, features = ["ts"] }
xdev-ai = { workspace = true, features = ["ts"] }
xdev-core = { workspace = true, features = ["ts"] }

[lints]
workspace = true
