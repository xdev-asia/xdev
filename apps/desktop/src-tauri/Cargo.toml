[package]
name = "xdev-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "xdev_desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blake3.workspace = true
dunce = "1.0.5"
notify-debouncer-full.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["devtools", "image-png"] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.6.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
tauri-plugin-updater = "2.14.1"
uuid = { version = "1.29", features = ["v4"] }
trash.workspace = true
xdev-agent.workspace = true
xdev-ai.workspace = true
xdev-awake.workspace = true
xdev-core.workspace = true
xdev-git.workspace = true
xdev-id.workspace = true
xdev-ipc.workspace = true
xdev-kit.workspace = true
xdev-orch.workspace = true
xdev-policy.workspace = true
xdev-pty.workspace = true
xdev-store.workspace = true
xdev-workspace.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
ts-rs.workspace = true
# Only the test that writes `packages/bindings` needs the TypeScript derives.
xdev-agent = { workspace = true, features = ["ts"] }
xdev-ai = { workspace = true, features = ["ts"] }
xdev-core = { workspace = true, features = ["ts"] }
xdev-git = { workspace = true, features = ["ts"] }
xdev-id = { workspace = true, features = ["ts", "test-util"] }
xdev-kit = { workspace = true, features = ["ts"] }
xdev-orch = { workspace = true, features = ["ts"] }
xdev-pty = { workspace = true, features = ["ts"] }
xdev-workspace = { workspace = true, features = ["ts"] }

[lints]
workspace = true
