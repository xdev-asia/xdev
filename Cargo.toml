[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
# The desktop crate's build script needs the built frontend, so plain
# `cargo test` stays on the core crates.
default-members = [
    "crates/xdev-core",
    "crates/xdev-vault",
    "crates/xdev-store",
    "crates/xdev-git",
    "crates/xdev-export",
    "crates/xdev-mcp",
    "crates/xdev-ai",
    "crates/xdev-id",
    "crates/xdev-kit",
    "crates/xdev-api",
    "crates/xdev-policy",
    "crates/xdev-agent",
    "crates/xdev-pty",
    "crates/xdev-ipc",
    "crates/xdev-awake",
    "crates/xdev-workspace",
    "crates/xdev-cli",
]

[workspace.package]
version = "0.5.0" # x-release-please-version
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/xdev-asia/xdev"
publish = false

[workspace.dependencies]
xdev-agent = { path = "crates/xdev-agent" }
xdev-ai = { path = "crates/xdev-ai" }
xdev-core = { path = "crates/xdev-core" }
xdev-export = { path = "crates/xdev-export" }
xdev-git = { path = "crates/xdev-git" }
xdev-id = { path = "crates/xdev-id" }
xdev-ipc = { path = "crates/xdev-ipc" }
xdev-awake = { path = "crates/xdev-awake" }
xdev-kit = { path = "crates/xdev-kit" }
xdev-mcp = { path = "crates/xdev-mcp" }
xdev-policy = { path = "crates/xdev-policy" }
xdev-pty = { path = "crates/xdev-pty" }
xdev-store = { path = "crates/xdev-store" }
xdev-vault = { path = "crates/xdev-vault" }
xdev-workspace = { path = "crates/xdev-workspace" }

# base64url for PKCE; already in the build.
base64 = "0.23.1"
blake3 = "1.8.7"
dirs = "7.0.0"
# Token bytes from the OS; already in the build through uuid.
getrandom = "0.4.3"
ignore = "0.4.34"
# Local sockets: a named pipe on Windows, a Unix socket elsewhere, behind one API.
interprocess = "2.4.7"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
# 0.7 is the newest stable line; it re-exports the `notify` it was built against.
notify-debouncer-full = "0.7.0"
# Pseudo consoles on every OS (ConPTY on Windows); pinned, its API moves between minors.
portable-pty = "=0.9.0"
# Search in files; already in the build through `ignore`.
regex = "1.13.1"
# Bundled SQLite ships FTS5 and behaves the same on every OS.
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The trust hash codex expects for a hook (sha256 of its definition).
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.21"
# The OS trash (Recycle Bin, Finder, freedesktop) for Delete in the file tree and a failed
# clone; never a hard delete.
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
# Merging the codex config.toml into a private CODEX_HOME.
toml = "1.1.8"
# TypeScript for the types that cross the desktop IPC boundary; behind each
# crate's `ts` feature so the CLI never builds it.
ts-rs = "12.0.1"
unicode-segmentation = "1"
# One blocking HTTPS call; rustls with its bundled roots, no async runtime.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
# Parsing the sign-in callback and building the authorize link; already in the build.
url = "2.5.8"
# The UTF-16 string a pipe's security descriptor is parsed from; already in the
# build through interprocess.
widestring = "1.2.1"
# A file's link count and identity on Windows, without unsafe code here.
winapi-util = "0.1.11"
# Win32 calls the named pipe API does not wrap (xdev-ipc); already in the build
# through interprocess.
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_code = "forbid"
