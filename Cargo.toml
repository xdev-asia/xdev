[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
# The desktop crate's build script needs the built frontend, so plain
# `cargo test` stays on the core crates.
default-members = [
    "crates/xdev-core",
    "crates/xdev-vault",
    "crates/xdev-store",
    "crates/xdev-git",
    "crates/xdev-export",
    "crates/xdev-mcp",
    "crates/xdev-ai",
    "crates/xdev-api",
    "crates/xdev-policy",
    "crates/xdev-agent",
    "crates/xdev-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/xdev-asia/xdev"
publish = false

[workspace.dependencies]
xdev-agent = { path = "crates/xdev-agent" }
xdev-ai = { path = "crates/xdev-ai" }
xdev-core = { path = "crates/xdev-core" }
xdev-export = { path = "crates/xdev-export" }
xdev-git = { path = "crates/xdev-git" }
xdev-mcp = { path = "crates/xdev-mcp" }
xdev-policy = { path = "crates/xdev-policy" }
xdev-store = { path = "crates/xdev-store" }
xdev-vault = { path = "crates/xdev-vault" }

blake3 = "1.8.7"
dirs = "7.0.0"
ignore = "0.4.34"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
# 0.7 is the newest stable line; it re-exports the `notify` it was built against.
notify-debouncer-full = "0.7.0"
# Bundled SQLite ships FTS5 and behaves the same on every OS.
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
# TypeScript for the types that cross the desktop IPC boundary; behind each
# crate's `ts` feature so the CLI never builds it.
ts-rs = "12.0.1"
# One blocking HTTPS call; rustls with its bundled roots, no async runtime.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
unsafe_code = "forbid"
